<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <defs>
    <!-- Gradients -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C9A84C" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0A0A0A" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8B84B" />
      <stop offset="50%" stop-color="#C9A84C" />
      <stop offset="100%" stop-color="#8A6D2B" />
    </linearGradient>

    <linearGradient id="shieldBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A1405" />
      <stop offset="100%" stop-color="#050401" />
    </linearGradient>

    <linearGradient id="shieldFade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0A0A0A" stop-opacity="0" />
      <stop offset="100%" stop-color="#0A0A0A" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="shimmerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E0E0E0" />
    </linearGradient>

    <radialGradient id="vignette" cx="50%" cy="50%" r="75%">
      <stop offset="50%" stop-color="#0A0A0A" stop-opacity="0" />
      <stop offset="100%" stop-color="#0A0A0A" stop-opacity="0.8" />
    </radialGradient>

    <!-- Filters -->
    <filter id="blurGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" />
    </filter>

    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.8" />
    </filter>

    <!-- Patterns -->
    <pattern id="diamonds" width="40" height="60" patternUnits="userSpaceOnUse" patternTransform="scale(0.8)">
      <path d="M 20 0 L 40 30 L 20 60 L 0 30 Z" stroke="#C9A84C" stroke-width="1.5" fill="none" opacity="0.25"/>
      <path d="M 20 10 L 33 30 L 20 50 L 7 30 Z" stroke="#C9A84C" stroke-width="0.75" fill="none" opacity="0.15"/>
    </pattern>

    <!-- Clip Paths -->
    <clipPath id="shieldClip">
      <path d="M 400 160 L 470 250 L 550 190 L 600 380 L 400 660 L 200 380 L 250 190 L 330 250 Z" />
    </clipPath>

    <!-- Reusable Elements -->
    <g id="rosette">
      <path d="M 0 -5 A 5 5 0 0 1 4 -3" stroke="#C9A84C" stroke-width="1.5" fill="none" stroke-linecap="round"/>
      <path d="M 5 2 A 5 5 0 0 1 1 6" stroke="#C9A84C" stroke-width="1.5" fill="none" stroke-linecap="round"/>
      <path d="M -4 4 A 5 5 0 0 1 -5 -1" stroke="#C9A84C" stroke-width="1.5" fill="none" stroke-linecap="round"/>
      <circle cx="0" cy="0" r="1.5" fill="#E8B84B" />
    </g>
  </defs>

  <style><![CDATA[
.glow-pulse {
      animation: glowOpacity 4s infinite ease-in-out;
    }
    @keyframes glowOpacity {
      0%, 100% { opacity: 0.1; }
      50% { opacity: 0.8; }
    }
    
    .shimmer-sweep {
      animation: sweep 3s infinite ease-in-out;
    }
    @keyframes sweep {
      0%, 15% { transform: translateX(-600px); }
      85%, 100% { transform: translateX(600px); }
    }
    
    .float {
      animation: floating 6s infinite ease-in-out;
    }
    @keyframes floating {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
]]></style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#0A0A0A" />
  <rect width="100%" height="100%" fill="url(#bgGlow)" />

  <!-- Outer Rings -->
  <circle cx="400" cy="400" r="340" stroke="url(#goldGrad)" stroke-width="1" fill="none" opacity="0.4" />
  <circle cx="400" cy="400" r="328" stroke="#C9A84C" stroke-width="1" fill="none" opacity="0.2" stroke-dasharray="6 6" />
  
  <!-- Animated Glow Ring -->
  <circle cx="400" cy="400" r="340" stroke="#E8B84B" stroke-width="6" fill="none" filter="url(#blurGlow)" class="glow-pulse" />

  <!-- Leopard-spot Texture Dots (Atmosphere) -->
  <g opacity="0.6">
    <use href="#rosette" x="400" y="70" transform="scale(1.2) rotate(15 400 70)" opacity="0.5"/>
    <use href="#rosette" x="200" y="140" transform="scale(0.8) rotate(45 200 140)" opacity="0.4"/>
    <use href="#rosette" x="600" y="140" transform="scale(0.9) rotate(-20 600 140)" opacity="0.6"/>
    <use href="#rosette" x="120" y="300" transform="scale(1.1) rotate(70 120 300)" opacity="0.5"/>
    <use href="#rosette" x="680" y="300" transform="scale(0.7) rotate(-45 680 300)" opacity="0.4"/>
    <use href="#rosette" x="150" y="500" transform="scale(0.9) rotate(110 150 500)" opacity="0.6"/>
    <use href="#rosette" x="650" y="500" transform="scale(1.2) rotate(-80 650 500)" opacity="0.5"/>
    <use href="#rosette" x="280" y="680" transform="scale(0.8) rotate(140 280 680)" opacity="0.4"/>
    <use href="#rosette" x="520" y="680" transform="scale(1) rotate(-110 520 680)" opacity="0.6"/>
    
    <!-- Scattered single dots -->
    <circle cx="320" cy="110" r="1.5" fill="#C9A84C" opacity="0.5"/>
    <circle cx="480" cy="100" r="2" fill="#E8B84B" opacity="0.4"/>
    <circle cx="110" cy="420" r="1" fill="#C9A84C" opacity="0.6"/>
    <circle cx="690" cy="380" r="2" fill="#E8B84B" opacity="0.5"/>
    <circle cx="220" cy="620" r="1.5" fill="#C9A84C" opacity="0.4"/>
    <circle cx="580" cy="610" r="1" fill="#E8B84B" opacity="0.6"/>
    <circle cx="400" cy="720" r="2" fill="#C9A84C" opacity="0.5"/>
  </g>

  <!-- Central Shield Emblem -->
  <g class="float">
    <!-- Shield Base & Pattern -->
    <g clip-path="url(#shieldClip)">
      <rect x="0" y="0" width="800" height="800" fill="url(#shieldBg)" />
      <rect x="0" y="0" width="800" height="800" fill="url(#diamonds)" />
      <rect x="0" y="0" width="800" height="800" fill="url(#shieldFade)" />
      
      <!-- Animated Shimmer Sweep -->
      <g transform="rotate(30, 400, 400)">
        <rect x="300" y="-200" width="200" height="1200" fill="url(#shimmerGrad)" class="shimmer-sweep" />
      </g>
    </g>

    <!-- Shield Borders -->
    <!-- Outer Thick Border -->
    <path d="M 400 160 L 470 250 L 550 190 L 600 380 L 400 660 L 200 380 L 250 190 L 330 250 Z" 
          stroke="url(#goldGrad)" stroke-width="12" stroke-linejoin="round" fill="none" />
    
    <!-- Inner Thin Border -->
    <path d="M 400 160 L 470 250 L 550 190 L 600 380 L 400 660 L 200 380 L 250 190 L 330 250 Z" 
          stroke="#E8B84B" stroke-width="2" stroke-linejoin="round" fill="none" 
          transform="scale(0.92)" transform-origin="400 400" opacity="0.7" />

    <!-- Inner Glow -->
    <path d="M 400 160 L 470 250 L 550 190 L 600 380 L 400 660 L 200 380 L 250 190 L 330 250 Z" 
          stroke="#E8B84B" stroke-width="6" stroke-linejoin="round" fill="none" 
          filter="url(#blurGlow)" opacity="0.3" clip-path="url(#shieldClip)" />

    <!-- "EK" Monogram -->
    <g filter="url(#dropShadow)">
      <!-- Letter E -->
      <path d="M 300 330 
               L 390 330 
               L 390 360 
               L 330 360 
               L 330 385 
               L 380 385 
               L 380 415 
               L 330 415 
               L 330 440 
               L 390 440 
               L 390 470 
               L 300 470 Z" 
            fill="url(#textGrad)" stroke="#C9A84C" stroke-width="1" stroke-linejoin="miter" />
      
      <!-- Letter K -->
      <path d="M 400 330 
               L 430 330 
               L 430 370 
               L 470 330 
               L 510 330 
               L 440 400 
               L 510 470 
               L 470 470 
               L 430 430 
               L 430 470 
               L 400 470 Z" 
            fill="url(#textGrad)" stroke="#C9A84C" stroke-width="1" stroke-linejoin="miter" />
    </g>
  </g>

  <!-- Foreground Vignette -->
  <rect width="100%" height="100%" fill="url(#vignette)" pointer-events="none" />
</svg>