name: Repair marketplace data connection
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch
        run: |
          python -c "from pathlib import Path; import re; p=Path('src/app/marketplace/components/MarketplaceContent.tsx'); s=p.read_text(); s=s.replace(\"import React, { useState } from 'react';\",\"import React, { useEffect, useMemo, useState } from 'react';\"); s=s.replace(\"import { useAuth } from '@/lib/useAuth';\",\"import { useAuth } from '@/lib/useAuth';\\nimport { createClient } from '@/lib/supabase/client';\"); s=s.replace('  id: number;','  id: string;'); s=re.sub(r'const allCategories = \[.*?\];\\n\\n\\nconst allCities = \[.*?\];\\n\\n', '', s, flags=re.S); s=re.sub(r'const allProducts: Product\[\] = \[.*?\];\\n\\n\\n// ─── Seller Profile Modal', '// ─── Seller Profile Modal', s, flags=re.S); marker='// ─── Main Component ───────────────────────────────────────────────────────────\\n\\nexport default function MarketplaceContent() {'; ins=\"\"\"// ─── Main Component ───────────────────────────────────────────────────────────\\n\\nexport default function MarketplaceContent() {\n  const [products, setProducts] = useState<Product[]>([]);\n  useEffect(() => {\n    const supabase = createClient(); let mounted = true;\n    const load = async () => {\n      const { data, error } = await supabase.from('products').select('id,name,description,price,unit,category,city,image_url,alt_text,stock_status,stock_qty,rating,review_count,vendor_id,vendor_name,vendor_type,vendor_phone,vendor_email,vendor_city,vendor_verified,vendor_since,enterprise_id,created_at,enterprises:enterprise_id(name,logo_url,cover_url,is_verified,founded_year,city)').eq('is_active', true).order('created_at', { ascending: false });\n      if (!mounted) return;\n      if (error) { console.error('Marketplace:', error.message); setProducts([]); return; }\n      const rows = (data || []) as any[]; const counts = new Map<string, number>(); rows.forEach(r => { if (r.vendor_id) counts.set(r.vendor_id, (counts.get(r.vendor_id) || 0) + 1); });\n      setProducts(rows.map(r => ({ id:r.id, name:r.name, vendor:r.vendor_name || r.enterprises?.name || 'Vendeur', vendorType:r.vendor_type || 'Entreprise', vendorPhone:r.vendor_phone || '', vendorEmail:r.vendor_email || '', vendorCity:r.vendor_city || r.enterprises?.city || r.city || '', vendorVerified:Boolean(r.vendor_verified || r.enterprises?.is_verified), price:r.price, unit:r.unit ? (r.unit.startsWith('/') ? r.unit : '/ ' + r.unit) : '', category:r.category || 'Autres', city:r.city || r.vendor_city || '', image:r.image_url || '', alt:r.alt_text || r.name, description:r.description || undefined, stock:r.stock_status || 'En stock', stockQty:r.stock_qty ?? 0, rating:r.rating == null ? undefined : Number(r.rating), reviewCount:r.review_count ?? 0, vendorSince:r.vendor_since || (r.enterprises?.founded_year ? String(r.enterprises.founded_year) : ''), vendorProducts:r.vendor_id ? counts.get(r.vendor_id) || 0 : undefined, vendorLogo:r.enterprises?.logo_url || undefined, vendorCover:r.enterprises?.cover_url || undefined, enterpriseId:r.enterprise_id || undefined })));\n    };\n    void load(); const channel=supabase.channel('marketplace-products').on('postgres_changes',{event:'*',schema:'public',table:'products'},()=>void load()).subscribe(); return()=>{mounted=false;void supabase.removeChannel(channel);};\n  }, []);\n  const allCategories=useMemo(()=>{const m=new Map<string,number>(); products.forEach(p=>m.set(p.category,(m.get(p.category)||0)+1)); return [{label:'Toutes catégories',count:products.length},...Array.from(m.entries()).sort(([a],[b])=>a.localeCompare(b,'fr')).map(([label,count])=>({label,count}))];},[products]);\n  const allCities=useMemo(()=>['Toutes les villes',...Array.from(new Set(products.map(p=>p.city).filter(Boolean))).sort((a,b)=>a.localeCompare(b,'fr'))],[products]);\"\"\"; s=s.replace(marker,ins); s=s.replace('  const filtered = allProducts?.filter((p) => {','  const filtered = products.filter((p) => {'); s=s.replace(\"                    category: product.category\\n                  })\",\"                    category: product.category, logoUrl: product.vendorLogo, coverUrl: product.vendorCover\\n                  })\"); s=s.replace(\"<div className=\\\"w-14 h-14 rounded-2xl bg-primary/15 flex items-center justify-center shrink-0\\\">\\n              <span className=\\\"text-lg font-extrabold text-primary\\\">{initials}</span>\",\"<div className=\\\"w-14 h-14 rounded-2xl bg-primary/15 flex items-center justify-center shrink-0 overflow-hidden\\\">\\n              {seller.logoUrl ? <AppImage src={seller.logoUrl} alt={seller.name} width={56} height={56} className=\\\"w-full h-full object-cover\\\" /> : <span className=\\\"text-lg font-extrabold text-primary\\\">{initials}</span>\"); s=s.replace(\"<div className=\\\"w-12 h-12 rounded-xl bg-primary/15 flex items-center justify-center shrink-0\\\">\\n                  <span className=\\\"text-base font-extrabold text-primary\\\">{initials}</span>\",\"<div className=\\\"w-12 h-12 rounded-xl bg-primary/15 flex items-center justify-center shrink-0 overflow-hidden\\\">\\n                  {product.vendorLogo ? <AppImage src={product.vendorLogo} alt={product.vendor} width={48} height={48} className=\\\"w-full h-full object-cover\\\" /> : <span className=\\\"text-base font-extrabold text-primary\\\">{initials}</span>\"); p.write_text(s)"
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app/marketplace/components/MarketplaceContent.tsx
          git commit -m 'Connect marketplace to Supabase [marketplace-patch]' || exit 0
          git push
