name: Fix enterprise image uploads
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch enterprise image persistence
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/app/member-dashboard/components/MonEntreprisePage.tsx')
          s = p.read_text()
          s = s.replace(
              "import { createClient } from '@/lib/supabase/client';",
              "import { createClient } from '@/lib/supabase/client';\nimport { uploadImage } from '@/lib/supabase/database';",
              1,
          )
          s = s.replace(
              "logo: row.logo_url || DEFAULT_LOGO,\n          cover: row.cover_url || DEFAULT_COVER,",
              "logo: row.logo_url && !row.logo_url.startsWith('blob:') ? row.logo_url : DEFAULT_LOGO,\n          cover: row.cover_url && !row.cover_url.startsWith('blob:') ? row.cover_url : DEFAULT_COVER,",
              1,
          )
          old = """  const handleImageUpload = useCallback((field: 'logo' | 'cover', file: File) => {\n    const err = validateImage(file);\n    if (err) { alert(err); return; }\n    const url = URL.createObjectURL(file);\n    setForm((prev) => ({ ...prev, [field]: url }));\n  }, []);"""
          new = """  const [uploadingImage, setUploadingImage] = useState(false);\n\n  const handleImageUpload = useCallback(async (field: 'logo' | 'cover', file: File) => {\n    const err = validateImage(file);\n    if (err) { alert(err); return; }\n\n    try {\n      setUploadingImage(true);\n      const publicUrl = await uploadImage(file, 'enterprise');\n      setForm((prev) => ({ ...prev, [field]: publicUrl }));\n      showSuccess(field === 'logo' ? 'Logo téléversé avec succès !' : 'Photo de couverture téléversée avec succès !');\n    } catch (error: any) {\n      console.error('Erreur upload image entreprise:', error);\n      alert(`Impossible de téléverser l'image : ${error?.message || 'erreur inconnue'}`);\n    } finally {\n      setUploadingImage(false);\n    }\n  }, []);"""
          if old not in s:
              raise SystemExit('callback pattern not found')
          s = s.replace(old, new, 1)
          s = s.replace(
              "      const employeeCount = Number.parseInt(form.employees, 10);",
              "      if (uploadingImage) {\n        alert('Le téléversement de l’image est encore en cours. Veuillez patienter.');\n        return;\n      }\n\n      const employeeCount = Number.parseInt(form.employees, 10);",
              1,
          )
          s = s.replace(
              "        logo_url: form.logo || DEFAULT_LOGO,\n        cover_url: form.cover || DEFAULT_COVER,",
              "        logo_url: form.logo && !form.logo.startsWith('blob:') ? form.logo : DEFAULT_LOGO,\n        cover_url: form.cover && !form.cover.startsWith('blob:') ? form.cover : DEFAULT_COVER,",
              1,
          )
          p.write_text(s)
          PY
      - name: Commit fix and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/member-dashboard/components/MonEntreprisePage.tsx
          git rm .github/workflows/fix-enterprise-image-upload.yml
          git commit -m "fix: persist enterprise logo and cover uploads" || exit 0
          git push
